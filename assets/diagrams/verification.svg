<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">Melkor verification surface</title>
  <desc id="d">Bar chart of the 41 registered CTest tests by category, the four libFuzzer targets, and the CLI exit code contract from 0 through 130.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #c9d1d9; }
    .h1 { font-size: 14px; fill: #e6edf3; letter-spacing: 2.5px; }
    .h2 { font-size: 11px; fill: #8b949e; letter-spacing: 2px; }
    .row { font-size: 12px; fill: #e6edf3; }
    .sub { font-size: 10px; fill: #8b949e; }
    .val { font-size: 11px; fill: #0d1117; font-weight: bold; }
    .code { font-size: 11px; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#0d1117" stroke="#2b333d"/>

  <text class="h1" x="40" y="44">MELKOR &#183; VERIFICATION SURFACE</text>
  <text class="h2" x="40" y="64">41 REGISTERED TESTS &#183; 4 FUZZ TARGETS &#183; ONE EXIT-CODE CONTRACT</text>

  <g>
    <text class="row" x="40" y="112">core + safety substrate</text>
    <rect x="320" y="98" width="600" height="20" rx="4" fill="#fb923c"/>
    <text class="val" x="892" y="112">12</text>

    <text class="row" x="40" y="152">glTF / GLB / KHR</text>
    <rect x="320" y="138" width="550" height="20" rx="4" fill="#a78bfa"/>
    <text class="val" x="842" y="152">11</text>

    <text class="row" x="40" y="192">providers + properties + CLI</text>
    <rect x="320" y="178" width="350" height="20" rx="4" fill="#34d399"/>
    <text class="val" x="648" y="192">7</text>

    <text class="row" x="40" y="232">Python contract suites</text>
    <rect x="320" y="218" width="300" height="20" rx="4" fill="#60a5fa"/>
    <text class="val" x="598" y="232">6</text>

    <text class="row" x="40" y="272">fuzz corpus replay</text>
    <rect x="320" y="258" width="250" height="20" rx="4" fill="#fbbf24"/>
    <text class="val" x="548" y="272">5</text>
  </g>

  <g>
    <rect x="40" y="308" width="880" height="86" rx="12" fill="#10151b" stroke="#2b333d"/>
    <text class="h2" x="64" y="338">COVERAGE-GUIDED FUZZING &#183; EVERY FIXED CRASH BECOMES A PERMANENT CORPUS ENTRY</text>
    <rect x="64" y="352" width="190" height="28" rx="14" fill="#161b22" stroke="#fb923c"/>
    <text class="code" x="88" y="371" fill="#fb923c">fuzz_ply</text>
    <rect x="270" y="352" width="190" height="28" rx="14" fill="#161b22" stroke="#34d399"/>
    <text class="code" x="294" y="371" fill="#34d399">fuzz_spz</text>
    <rect x="476" y="352" width="190" height="28" rx="14" fill="#161b22" stroke="#a78bfa"/>
    <text class="code" x="500" y="371" fill="#a78bfa">fuzz_glb</text>
    <rect x="682" y="352" width="214" height="28" rx="14" fill="#161b22" stroke="#60a5fa"/>
    <text class="code" x="706" y="371" fill="#60a5fa">fuzz_gltf_khr</text>
  </g>

  <g>
    <rect x="40" y="414" width="880" height="100" rx="12" fill="#10151b" stroke="#2b333d"/>
    <text class="h2" x="64" y="444">EXIT-CODE CONTRACT &#183; SCRIPTS BRANCH ON THE KIND OF FAILURE</text>
    <g class="code">
      <text x="64"  y="474" fill="#34d399">0 ok</text>
      <text x="150" y="474" fill="#fbbf24">2 bad args</text>
      <text x="286" y="474" fill="#fb7185">3 bad data</text>
      <text x="422" y="474" fill="#a78bfa">4 unsupported</text>
      <text x="592" y="474" fill="#60a5fa">5 io error</text>
      <text x="722" y="474" fill="#fb923c">6 over limit</text>
      <text x="64"  y="498" fill="#2dd4bf">7 no backend</text>
      <text x="226" y="498" fill="#ef4444">8 internal bug</text>
      <text x="404" y="498" fill="#8b949e">130 cancelled (128 + SIGINT)</text>
    </g>
  </g>

  <text class="sub" x="40" y="540">source: CMakeLists.txt add_test entries &#183; src/core/error.cpp exit_code_for</text>
</svg>
