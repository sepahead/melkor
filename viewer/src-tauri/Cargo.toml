[package]
name = "melkor-viewer"
version = "2.0.0-dev"
description = "Desktop Gaussian-splat viewer for Melkor"
authors = ["Sepehr Mahmoudian"]
license = "MIT"
repository = "https://github.com/sepahead/melkor"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[patch.crates-io]
# Tauri's Linux GTK3 graph requires glib 0.18.5. Use the reviewed source with its upstream fix.
glib = { path = "../../third_party/glib" }
