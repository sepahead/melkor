name: Format compatibility
description: Report a file that changes meaning or fails across a tool boundary
title: "[format] "
# GitHub applies only labels that exist in the repository.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for file interoperability defects.

        Gaussian-splat producers can use different field meanings.
        Melkor resolves these differences with explicit format profiles.
        Give the exact tool, version, and profile for each side.

  - type: input
    id: producer
    attributes:
      label: Producer tool and version
      description: Identify the tool that wrote the file. Give its exact version or commit.
      placeholder: "OpenSplat 1.1.4, commit 9c1f2ab"
    validations:
      required: true

  - type: input
    id: consumer
    attributes:
      label: Consumer tool and version
      description: Identify the tool that read or rejected the file. Give its exact version.
      placeholder: "Melkor 2.0.0-dev / git <short SHA>"
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Failure direction
      options:
        - Melkor rejects another tool's file
        - Another tool rejects Melkor's file
        - Both tools read the file but produce different results
        - A Melkor round trip changes or loses data
    validations:
      required: true

  - type: input
    id: format-profile
    attributes:
      label: Format and profile
      description: Give the container and the exact format profile ID passed to Melkor.
      placeholder: "PLY, ply:graphdeco-3dgs-v1 / SPZ, spz:spz-v1-v3"
    validations:
      required: true

  - type: textarea
    id: inspection
    attributes:
      label: Inspection report
      description: >-
        Paste the output from `melkor inspect <asset> --json`.
        If two files are involved, label and paste both reports.
      render: json
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands and output
      description: Paste the exact commands and their complete output. Capture both streams with `2>&1`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual meaning
      description: >-
        State the expected meaning and the actual result.
        Link the applicable specification, profile, or producer documentation.
      placeholder: |
        Expected: Rotations remain unchanged under the selected profile.
        Actual: The converted scene is mirrored on the X axis.
    validations:
      required: true

  - type: textarea
    id: asset
    attributes:
      label: Sample asset
      description: >-
        Attach the smallest file that shows the defect.
        Attach only assets that you can redistribute.
        If sharing is not possible, describe how to produce an equivalent file.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I gave the exact tool, version, and format profile for both sides.
          required: true
        - label: I can redistribute each attached asset. The attachments contain no personal data.
          required: true
        - label: >-
            This report does not describe a suspected security defect.
            I will use private vulnerability reporting for a security defect.
          required: true
