name: Performance problem
description: Report a reproducible speed or memory problem
title: "[perf] "
# GitHub applies only labels that exist in the repository.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Give the hardware, input, versions, command, and measurements.

        Report unbounded resource use through
        [private vulnerability reporting](https://github.com/sepahead/melkor/security/advisories/new).
        Do not create a public issue for a suspected security defect.

  - type: textarea
    id: summary
    attributes:
      label: Performance problem
      description: Identify the slow operation and the comparison baseline.
    validations:
      required: true

  - type: input
    id: measurement
    attributes:
      label: Measurement
      description: Give wall time, peak memory, or throughput. Include the run count and variance.
      placeholder: "2.1 million splats: 94 seconds, 11.2 GiB peak RSS, three runs"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Reproducible command
      description: Paste the exact command and the timing tool that you used.
      render: shell
      placeholder: |
        $ /usr/bin/time -l melkor convert scene.glb scene.ply
        ...
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Input data
      description: >-
        Give the format, file size, splat count, SH degree, and production method.
        Paste `melkor inspect <asset> --json` when possible.
        Attach only assets that you can redistribute.
      render: json
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Give the CPU, memory, storage type, and applicable GPU details.
      placeholder: "Apple M2 Pro, 10 cores, 32 GiB memory, internal NVMe"
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: >-
        Give the Melkor version or commit, installation method, operating system, build type,
        compiler version, SPZ setting, and sanitizer setting.
      render: text
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression status
      description: State whether an earlier Melkor version completed the same work faster.
      options:
        - Yes, an earlier version was faster
        - No, all tested versions behave the same
        - Unknown or first use
    validations:
      required: true

  - type: textarea
    id: profile
    attributes:
      label: Profile or trace
      description: Attach a `perf` or Instruments profile when available. Name the dominant phase.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: I measured a Release build or explained why I did not.
          required: true
        - label: Another person can reproduce the command with the supplied input description.
          required: true
        - label: >-
            This report does not describe unbounded resource use.
            I will report unbounded resource use through the private security channel.
          required: true
        - label: I can redistribute each attached asset. The attachments contain no personal data.
          required: true
