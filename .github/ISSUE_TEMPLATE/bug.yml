name: Bug report
description: Report a reproducible defect in the CLI, C SDK, viewer, or development adapters
title: "[bug] "
# GitHub applies only labels that exist in the repository.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing a report.

        Use [private vulnerability reporting](https://github.com/sepahead/melkor/security/advisories/new)
        for a suspected security defect. Do not create a public issue.

        Use [Discussions](https://github.com/sepahead/melkor/discussions) for usage questions
        or uncertain reports.

        Complete each required field. This information helps the maintainer reproduce the defect.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe the operation and the defect in one paragraph.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Melkor version
      description: >-
        Paste the release tag or the output of `melkor --version`.
        Give the exact commit for a source build. Use `git rev-parse HEAD`.
      placeholder: "v2.0.0-rc.1 / git 4f2a91c"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      description: Select the method that installed Melkor.
      options:
        - Built from source with CMake
        - GitHub release archive or binary
        - Desktop viewer package
        - Other or unknown
    validations:
      required: true

  - type: input
    id: os-arch
    attributes:
      label: Operating system and architecture
      description: Give the operating system, version, and CPU architecture.
      placeholder: "macOS 15.3, arm64 / Ubuntu 24.04, x86_64"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Build and environment
      description: >-
        Give the CMake preset, build type, compiler version, and SPZ setting.
        For the viewer, give the browser or desktop-shell version.
        Identify all removed sensitive text.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Command and output
      description: >-
        Paste the exact command or API call and its complete output.
        Capture both streams with `2>&1`. Remove sensitive values.
      render: shell
      placeholder: |
        $ melkor inspect scene.ply --json 2>&1
        ...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: State the expected behavior and the actual behavior separately.
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: asset
    attributes:
      label: Asset and inspection report
      description: >-
        If an input file causes the defect, paste the output from
        `melkor inspect <asset> --json`. Attach only assets that you can redistribute.
        If you cannot share the asset, describe how to produce an equivalent file.
      render: json

  - type: textarea
    id: workaround
    attributes:
      label: Regression and workaround
      description: >-
        State whether an earlier version worked. Give that version.
        Describe each known workaround.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: >-
            This report does not describe a suspected security defect.
            I will use private vulnerability reporting for a security defect.
          required: true
        - label: >-
            I can redistribute each attached asset. The attachments contain no personal data.
          required: true
        - label: >-
            I removed sensitive values from the output and identified each removal.
          required: true
        - label: I searched existing issues and found no duplicate.
          required: true
