# Keep blank issues available for reports that do not match a form.
blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability privately
    url: https://github.com/sepahead/melkor/security/advisories/new
    about: >-
      Do not create a public issue for a suspected security defect.
      Resource exhaustion, memory unsafety, and injection defects are in scope.

  - name: Ask a question or discuss an idea
    url: https://github.com/sepahead/melkor/discussions
    about: Use Discussions for usage questions, uncertain reports, and early design work.

  - name: Read the support policy
    url: https://github.com/sepahead/melkor/blob/main/SUPPORT.md
    about: Read the supported-version policy and the required report information.

  - name: Read the contribution and governance guides
    url: https://github.com/sepahead/melkor/blob/main/CONTRIBUTING.md
    about: Read the development, verification, and decision rules.
