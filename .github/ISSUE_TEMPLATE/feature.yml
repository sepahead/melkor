name: Feature request
description: Propose a capability, format profile, or contract change
title: "[feature] "
# GitHub applies only labels that exist in the repository.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read the product boundary in [ROADMAP.md](https://github.com/sepahead/melkor/blob/main/ROADMAP.md).
        Read the decision process in [GOVERNANCE.md](https://github.com/sepahead/melkor/blob/main/GOVERNANCE.md).

        Melkor inspects and converts Gaussian-splat assets.
        It is not a renderer, reconstruction system, or training system.
        Development adapters can invoke pinned external tools.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before you describe a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: >-
        Define the flags or API, defaults, output, failure modes, and exit codes.
        State the complete user-visible contract.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surfaces
      description: Select each surface that the proposal changes.
      multiple: true
      options:
        - CLI
        - C SDK
        - File format or format profile
        - Viewer or desktop application
        - External development adapter
        - Packaging, release, or provenance
        - Documentation only
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Product boundary
      description: Select the best description of this proposal.
      options:
        - Native inspection or conversion
        - External pinned adapter
        - Explicit product-boundary change
        - Unknown
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: >-
        Identify all changed commands, defaults, outputs, and assets.
        If a format profile changes meaning, define a new profile ID.
      placeholder: "Additive change. No existing behavior changes."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Describe the tested alternatives and the current workaround.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and specification
      description: >-
        Link the applicable specification or producer documentation.
        Give measurements for each quality or performance claim.

  - type: textarea
    id: contribution
    attributes:
      label: Implementation offer
      description: >-
        State whether you can implement the proposal.
        List the supported platforms and tests that you can cover.
      placeholder: "I can implement and test this on macOS and Linux."

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: >-
            I read the product boundary in ROADMAP.md.
            This proposal follows that boundary or requests a specific change.
          required: true
        - label: I searched existing issues and discussions and found no duplicate.
          required: true
