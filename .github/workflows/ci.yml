name: CI

on:
  push:
    branches: [main]
    tags: ["v*-rc.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          brew install cmake ninja
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            jsonschema==4.26.0 numpy==2.4.6
          ./scripts/setup_deps.sh
      - name: Build
        run: |
          cmake --preset dev \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset dev --parallel "$(sysctl -n hw.ncpu)"
      - name: Test
        run: |
          set -o pipefail
          ctest --preset dev -N | grep -F 'gaussians_from_prediction_tests' >/dev/null
          ctest --preset dev
          ./build/dev/melkor --version
          cmake --install build/dev --prefix "$RUNNER_TEMP/melkor-install"
          test -s "$RUNNER_TEMP/melkor-install/share/melkor/LICENSE"
          test -s "$RUNNER_TEMP/melkor-install/share/melkor/NOTICE"
          test -s "$RUNNER_TEMP/melkor-install/share/melkor/THIRD_PARTY_LICENSES.md"
      - name: Build without SPZ
        run: |
          cmake --preset spz-off \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset spz-off --parallel "$(sysctl -n hw.ncpu)"
          ctest --preset spz-off
      - name: Verify third-party dependency lock
        run: python3 tools/verify_third_party.py --check

  sanitize-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          brew install cmake ninja
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            jsonschema==4.26.0 numpy==2.4.6
          ./scripts/setup_deps.sh
      - name: Build with ASan+UBSan
        run: |
          cmake --preset asan-ubsan \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="13.0" \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset asan-ubsan --parallel "$(sysctl -n hw.ncpu)"
      - name: Test under sanitizers
        run: |
          set -o pipefail
          ctest --preset asan-ubsan -N | grep -F 'gaussians_from_prediction_tests' >/dev/null
          ctest --preset asan-ubsan

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          # The GitHub Ubuntu runner preinstalls Microsoft/azure-cli apt
          # sources that intermittently serve a bad InRelease ('NOSPLIT'),
          # failing apt-get update even though melkor needs none of them.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build zlib1g-dev
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            jsonschema==4.26.0 numpy==2.4.6
          ./scripts/setup_deps.sh
      - name: Build
        run: |
          cmake --preset dev \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build --preset dev --parallel "$(nproc)"
      - name: Test
        run: |
          set -o pipefail
          ctest --preset dev -N | grep -F 'gaussians_from_prediction_tests' >/dev/null
          ctest --preset dev
          ./build/dev/melkor --version
      - name: SDK install and consumer test
        run: bash scripts/test_sdk_install.sh -DBUILD_SHARED_LIBS=ON

  build-windows:
    name: Windows 2025 / MSVC
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: `
            jsonschema==4.26.0 numpy==2.4.6
      - name: Select the installed MSVC toolchain
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with the C++ tools is missing."
          }
          $devCommand = "$vsPath/Common7/Tools/VsDevCmd.bat"
          if (-not (Test-Path $devCommand -PathType Leaf)) {
            throw "VsDevCmd.bat is missing."
          }
          $devEnvironment = & $env:COMSPEC /d /s /c `
            "call `"$devCommand`" -no_logo -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed."
          }
          $values = @{}
          foreach ($line in $devEnvironment) {
            $separator = $line.IndexOf("=")
            if ($separator -gt 0) {
              $values[$line.Substring(0, $separator)] = $line.Substring($separator + 1)
            }
          }
          foreach ($name in @("PATH", "INCLUDE", "LIB", "LIBPATH")) {
            if (-not $values.ContainsKey($name)) {
              throw "The MSVC environment does not define $name."
            }
            Set-Item -Path "Env:$name" -Value $values[$name]
            "$name=$($values[$name])" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MELKOR_DUMPBIN=$dumpbin" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "MSVC compiler: $compiler"
      - name: Build without SPZ
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_CXX_COMPILER="$env:CXX" `
            -DMELKOR_BUILD_SPZ=OFF `
            -DMELKOR_WERROR=ON
          cmake --build build/windows --parallel
      - name: Test
        run: ctest --test-dir build/windows --output-on-failure --no-tests=error
      - name: Install and test the C ABI
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "melkor-install"
          cmake --install build/windows --prefix $prefix
          if (-not (Test-Path "$prefix/include/melkor/c/melkor.h")) {
            throw "The installed C header is missing."
          }
          if (-not (Test-Path "$prefix/bin/melkor.dll")) {
            throw "The installed shared library is missing."
          }
          $exports = & $env:MELKOR_DUMPBIN /nologo /exports "$prefix/bin/melkor.dll" |
            ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                $Matches[1]
              }
            } |
            Sort-Object -Unique
          $expectedExports = @(
            "melkor_get_version",
            "melkor_inspect_ply_file",
            "melkor_status_string"
          ) | Sort-Object
          $exportDifference = Compare-Object $expectedExports $exports
          if ($exportDifference) {
            $exportDifference | Format-Table | Out-String | Write-Error
            throw "The DLL export set does not match the C ABI."
          }
          foreach ($required in @(
            "share/melkor/licenses/spz-LICENSE",
            "share/melkor/licenses/nlohmann-json-LICENSE",
            "share/melkor/licenses/glib-LICENSE",
            "share/melkor/profiles/spz/spz-v1-v3.json",
            "share/melkor/schemas/loss-report-v1.schema.json"
          )) {
            if (-not (Test-Path (Join-Path $prefix $required) -PathType Leaf)) {
              throw "The installed package is missing $required."
            }
          }
          $env:PATH = "$prefix/bin;$env:PATH"
          & "$prefix/bin/melkor.exe" --version
          foreach ($consumer in @("consumer-c", "consumer-cpp")) {
            $build = "build/$consumer-windows"
            cmake -S "tests/install/$consumer" -B $build -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_PREFIX_PATH=$prefix
            cmake --build $build --parallel
            ctest --test-dir $build --output-on-failure --no-tests=error
          }

  lint-python:
    name: Python and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            jsonschema==4.26.0 numpy==2.4.6 ruff==0.15.18
      - name: Lint maintained Python
        run: |
          # Lint Melkor-authored Python only. The root pyproject.toml excludes the
          # vendored third_party tree, which is never Melkor's to lint. Running ruff
          # with no explicit paths picks up the root config and respects that exclude.
          ruff check . --no-unsafe-fixes
      - name: Verify dependency lock, notices, and version sync
        run: |
          # The lock records the exact upstream revision and a content digest of every
          # vendored tree, plus every local patch. Drift here means either an undeclared
          # fork or a stale notice -- both are license problems, not style problems.
          python3 tools/verify_third_party.py --check
          python3 tools/generate_notices.py --check
          python3 tools/check_version_sync.py --check
      - name: Verify source-bundle allowlist
        run: python3 tools/build_source_bundle.py --check
      - name: Lint public prose for unqualified claims
        run: |
          python3 tools/check_claims.py
          python3 tools/check_docs_links.py
          python3 tools/check_docs_style.py
      - name: Validate format profiles
        run: python3 tools/check_profiles.py
      - name: Test DA3 synthetic Gaussian conversion
        run: |
          python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          python tests/test_gaussians_from_prediction.py
      - name: Check Bash syntax
        run: |
          git ls-files -z -- '*.sh' | xargs -0 -n 1 bash -n --
          git ls-files -z -- '*.sh' | xargs -0 shellcheck --severity=warning

  viewer-tests:
    name: Viewer / Playwright (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install viewer dependencies from lockfile
        working-directory: viewer
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Install Playwright Chromium
        working-directory: viewer
        run: npx playwright install --with-deps chromium
      - name: Fetch integrity-checked viewer assets
        working-directory: viewer
        run: ./fetch-assets.sh
      - name: Run viewer tests
        working-directory: viewer
        run: bun run test -- --project=chromium
      - name: Upload viewer failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: viewer/test-results/
          if-no-files-found: ignore
          retention-days: 7

  tauri-check:
    name: Tauri / Rust 1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal \
            --component rustfmt --component clippy
          rustup run 1.88.0 rustc --version
          rustup run 1.88.0 cargo --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Fetch digest-pinned desktop runtime
        working-directory: viewer
        run: ./fetch-assets.sh --runtime-only
      - name: Format, lint, and check locked Tauri dependency graph
        working-directory: viewer/src-tauri
        run: |
          rustup run 1.88.0 cargo fmt --check
          rustup run 1.88.0 cargo clippy --locked --all-targets -- -D warnings
          rustup run 1.88.0 cargo test --locked
          rustup run 1.88.0 cargo check --locked
      - name: Audit Rust dependencies
        run: |
          rustup run 1.88.0 cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path viewer/src-tauri/Cargo.toml \
            --config viewer/src-tauri/deny.toml --locked \
            check advisories bans licenses sources
      - name: Verify generated Rust license inventory
        working-directory: viewer/src-tauri
        run: |
          rustup run 1.88.0 cargo install cargo-about --version 0.9.1 --locked --features cli
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc; do
            rustup run 1.88.0 cargo fetch --locked --target "$target"
          done
          cargo about generate --frozen --fail \
            -o ../RUST_THIRD_PARTY_LICENSES.html about.hbs
          git diff --exit-code -- ../RUST_THIRD_PARTY_LICENSES.html
      - name: Build the staged desktop application
        working-directory: viewer
        run: |
          rustup run 1.88.0 cargo install tauri-cli --version 2.11.4 --locked
          rustup run 1.88.0 cargo tauri build --no-bundle

  fuzz-smoke:
    name: Fuzz smoke (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang and Ninja
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build zlib1g-dev
      - name: Build the coverage-guided fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMELKOR_BUILD_SPZ=ON \
            -DMELKOR_BUILD_FUZZERS=ON
          cmake --build build/fuzz --parallel
      - name: Run a bounded fuzz session on each target
        run: |
          # A short PR-smoke run: seed from the committed corpus and stop after a bounded time.
          # A crash, sanitizer finding, OOM, or timeout is a failure. Longer scheduled fuzzing
          # remains a release-hardening task and is not implied by this smoke job.
          for target in fuzz_ply:ply fuzz_spz:spz fuzz_glb:glb fuzz_gltf_khr:gltf_khr; do
            name=${target%%:*}; corpus=${target##*:}
            ./build/fuzz/$name fuzz/corpus/$corpus \
              -max_total_time=120 -rss_limit_mb=2048 -timeout=25 -print_final_stats=1
          done
      - name: Replay the seed corpus as a regression (deterministic)
        run: |
          cmake -S . -B build/replay -G Ninja -DMELKOR_BUILD_SPZ=ON
          cmake --build build/replay --target \
            fuzz_ply_replay fuzz_spz_replay fuzz_glb_replay fuzz_gltf_khr_replay
          ctest --test-dir build/replay -R '_replay' --output-on-failure

  # The single stable status check for branch protection.
  #
  # Branch protection requires this ONE job, not the individual matrix jobs. Requiring the matrix
  # jobs by name is fragile: rename a job, or a path filter skips it, and the protection silently
  # weakens because a check that never runs cannot fail. This job depends on all the others and
  # fails unless each finished successfully (or was legitimately skipped), so protection stays
  # meaningful even as the matrix changes.
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - secrets-scan
      - dependency-review
      - build-macos
      - sanitize-macos
      - build-linux
      - build-windows
      - lint-python
      - viewer-tests
      - tauri-check
      - fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify every required job succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | python3 tools/check_ci_results.py --event "$EVENT_NAME"
